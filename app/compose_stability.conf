// Classes the Compose compiler cannot infer as stable but which are.
//
// Read app/build/compose_reports/app_debug-classes.txt before adding anything
// here: the report says what the compiler decided and which field changed its
// mind. Every line below was added because that report named the class unstable
// and the field it named is a `List` the class only ever receives already-built.
//
// Why it matters. Strong skipping already makes the row composables skippable
// (app_debug-composables.txt: TrackItem, AlbumItem, ArtistItem and
// UnifiedSearchTrackItem are all `restartable skippable`), but for an unstable
// parameter it falls back to comparing by identity. The repository rebuilds
// every row object on every database emission — LocalMediaRepository's
// toUnifiedTrack() allocates a new UnifiedTrack, and new lists inside it, per
// track per emission — so identity never matches and every visible row
// recomposes even when nothing about it changed. Marked stable, the comparison
// becomes `equals`, and an unchanged row skips.
//
// What makes this safe rather than a guess. Each class is a data class whose
// every property is a `val` of a stable type or a List, and no MutableList
// reaches any of them: the lists are built with listOf / listOfNotNull /
// emptyList at the mapping boundary and never handed out for mutation. If that
// ever stops being true — someone stores a MutableList in one of these — the
// promise made here is silently broken and rows will go stale instead of
// updating. That is the cost of this file, and it is why it lists specific
// classes rather than a wildcard, and why kotlin.collections.List is NOT here.

// Rendered in every library, search and playlist row.
tf.monochrome.android.domain.model.UnifiedTrack
tf.monochrome.android.domain.model.UnifiedAlbum
tf.monochrome.android.domain.model.UnifiedArtist
tf.monochrome.android.domain.model.UnifiedArtistRef

// The legacy catalogue models, still rendered by TrackItem / AlbumItem /
// ArtistItem on the Liked, Recent and Playlist pages. Artist is the root of the
// other two: Track and Album are unstable only because they hold an Artist.
tf.monochrome.android.domain.model.Track
tf.monochrome.android.domain.model.Album
tf.monochrome.android.domain.model.Artist
