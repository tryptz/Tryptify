# The Tryptify website: static files served by Cloudflare (Workers static
# assets), plus src/worker.js for the APK download. Deploy: npx wrangler deploy
# (from this folder).
name = "tryptify-site"
# src/worker.js answers /download/tryptify.apk and /video/*, and adds a nonce to each page.
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# tryptify.com and www.tryptify.com (a zone on this Cloudflare account).
routes = [
  { pattern = "tryptify.com", custom_domain = true },
  { pattern = "www.tryptify.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Pages run the Worker too (it stamps each one's Content-Security-Policy with
# a fresh nonce, see src/worker.js); scripts, styles, pictures and fonts don't.
run_worker_first = ["/*", "!/js/*", "!/img/*", "!/fonts/*", "!/data/*", "!/*.css", "!/*.png", "!/*.svg"]
# /cloud serves cloud.html, /terms serves terms.html, and so on.
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

# The APK, too big for a static file.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "tryptify-downloads"
