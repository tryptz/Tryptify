name: Promotional screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to capture (latest uses the latest stable release)'
        default: latest
        required: true
        type: string
      strict:
        description: 'Fail if any planned screen cannot be captured (artifacts are still uploaded)'
        default: true
        type: boolean
  push:
    branches: [tryptz/promo-screenshots]
    paths:
      - '.github/workflows/promo-screenshots.yml'
      - 'tools/promo/**'

permissions:
  contents: read

concurrency:
  group: promo-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
      STRICT_CAPTURE: ${{ github.event_name == 'push' || inputs.strict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install capture dependencies
        run: |
          python -m pip install -r tools/promo/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Validate capture helpers
        run: |
          python -m unittest discover -s tools/promo -p 'test_*.py'
          python -m py_compile tools/promo/capture.py tools/promo/prepare.py
          bash -n tools/promo/capture.sh
      - name: Download published APK and create demo library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p promo-output
          python tools/promo/prepare.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture app screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tools/promo/capture.sh
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f promo-output/coverage.md ]; then
            cat promo-output/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Capture did not start or failed during setup. See the job logs and available artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots, gallery and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryptify-promo-${{ github.run_number }}
          path: promo-output/
          if-no-files-found: warn
          retention-days: 30
