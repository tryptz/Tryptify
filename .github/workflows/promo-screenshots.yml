name: Promotional screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to capture (latest uses the latest stable release)'
        default: latest
        required: true
        type: string
      build_ref:
        description: 'Branch, tag or commit to build and capture instead of a release (e.g. tryptz/mixer-add-bus). Empty uses release_tag.'
        default: ''
        required: false
        type: string
      targets:
        description: 'Only these screen ids, comma-separated (e.g. now-playing,mixer). Empty captures all.'
        default: ''
        required: false
        type: string
      strict:
        description: 'Fail if any planned screen cannot be captured (artifacts are still uploaded)'
        default: true
        type: boolean
  push:
    branches: [tryptz/promo-screenshots]
    paths:
      - '.github/workflows/promo-screenshots.yml'
      - 'tools/promo/**'

permissions:
  contents: read

concurrency:
  group: promo-screenshots-${{ github.ref }}-${{ inputs.build_ref }}-${{ inputs.targets }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    # A branch build adds the native/Gradle build (~30 min) before capture.
    timeout-minutes: 100
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
      BUILD_REF: ${{ inputs.build_ref || '' }}
      PROMO_TARGETS: ${{ inputs.targets || '' }}
      STRICT_CAPTURE: ${{ github.event_name == 'push' || inputs.strict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install capture dependencies
        run: |
          python -m pip install -r tools/promo/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Validate capture helpers
        run: |
          python -m unittest discover -s tools/promo -p 'test_*.py'
          python -m py_compile tools/promo/capture.py tools/promo/prepare.py
          bash -n tools/promo/capture.sh
      # ── Branch build (only when build_ref is set) ─────────────────────
      # The capture scripts come from this checkout; the app comes from
      # build_ref, checked out beside it with its submodules. The benchmark
      # variant is release-shaped (minified, not debuggable) but signed with
      # the committed debug key, so no release keystore is needed.
      - name: Free runner disk for the build
        if: env.BUILD_REF != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift
      - name: Check out build_ref
        if: env.BUILD_REF != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          path: app-src
          submodules: recursive
          fetch-depth: 1
      # The runner image ships an Android SDK (ANDROID_HOME). setup-android@v3
      # is not used: it installs the retired 'tools' package, which sdkmanager
      # no longer finds, and fails.
      - name: Install NDK and CMake
        if: env.BUILD_REF != ''
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Build release-shaped APK from build_ref
        if: env.BUILD_REF != ''
        working-directory: app-src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleBenchmark --stacktrace 2>&1 | tee ../gradle-build.log
          apk=$(find app/build/outputs/apk/benchmark -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "APK_PATH=$PWD/$apk" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Upload build log
        if: failure() && env.BUILD_REF != ''
        uses: actions/upload-artifact@v4
        with:
          name: promo-build-log-${{ github.run_number }}
          path: gradle-build.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Prepare APK and create demo library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p promo-output
          python tools/promo/prepare.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The trigger is asynchronous: wait for it, and set the mode directly
          # so the check below does not race the udev rule.
          sudo udevadm settle
          if [ ! -e /dev/kvm ]; then
            echo '::error::/dev/kvm is missing: this runner has no hardware virtualization.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture app screens
        # Bounded below the job limit: when a slow emulator runs long, this
        # step stops and the summary and upload below still run, so the
        # screens already captured are kept.
        timeout-minutes: 70
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tools/promo/capture.sh
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f promo-output/coverage.md ]; then
            cat promo-output/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Capture did not start or failed during setup. See the job logs and available artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots, gallery and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryptify-promo-${{ github.run_number }}
          path: promo-output/
          if-no-files-found: warn
          retention-days: 30
