name: iOS IPA

on:
  push:
    branches: [iOS-port]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-release.yml'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

env:
  APP_NAME: Tryptify
  IPA_NAME: tryptify
  BUNDLE_ID: tf.tryptify.ios
  # Keep in sync with ios/build.gradle.kts framework baseName.
  FRAMEWORK: TryptifyKit

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (wrapper + dependency caching)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native links a static framework per iOS target. No Xcode
      # project involved — Gradle is the source of truth.
      - name: Link TryptifyKit (device + simulator)
        run: |
          ./gradlew --no-daemon \
            :ios:linkReleaseFrameworkIosArm64 \
            :ios:linkReleaseFrameworkIosSimulatorArm64

      # Compile the two-file Swift shell against the framework's generated
      # Obj-C header and link in one driver invocation (main.swift must be
      # compiled without -parse-as-library so it emits the entry point).
      - name: Compile + link Swift shell (arm64 device)
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/ios
          FWDIR="ios/build/bin/iosArm64/releaseFramework"

          swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -F "$FWDIR" \
            -framework TryptifyKit \
            -framework UIKit -framework Foundation \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            ios/iosApp/Sources/main.swift \
            ios/iosApp/Sources/AppDelegate.swift \
            -o build/ios/Tryptify

      - name: Assemble .app
        run: |
          set -euxo pipefail
          APP="build/ios/$APP_NAME.app"
          FWDIR="ios/build/bin/iosArm64/releaseFramework"

          mkdir -p "$APP/Frameworks"
          cp "build/ios/$APP_NAME" "$APP/$APP_NAME"
          cp -R "$FWDIR/$FRAMEWORK.framework" "$APP/Frameworks/"
          cp ios/iosApp/Info.plist "$APP/Info.plist"

          # Thin to arm64 only if the framework is a fat binary; Gradle's
          # per-target framework is normally already single-arch (Non-fat).
          if lipo "$APP/Frameworks/$FRAMEWORK.framework/$FRAMEWORK" -info | grep -q "Non-fat"; then
            echo "framework is already single-arch: skipping lipo"
          else
            lipo "$APP/Frameworks/$FRAMEWORK.framework/$FRAMEWORK" \
              -thin arm64 -output \
              "$APP/Frameworks/$FRAMEWORK.framework/$FRAMEWORK"
          fi

          # Sign nested code first (framework), then the app binary.
          codesign --force --sign - "$APP/Frameworks/$FRAMEWORK.framework"
          codesign --force --sign - "$APP"

          du -sh "$APP"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          mkdir -p build/ipa/Payload
          cp -R "build/ios/$APP_NAME.app" build/ipa/Payload/
          (cd build/ipa && zip -qry "$IPA_NAME.ipa" Payload)
          mv "build/ipa/$IPA_NAME.ipa" "build/ios/$IPA_NAME.ipa"
          ls -lh "build/ios/$IPA_NAME.ipa"

      - name: Version metadata
        id: meta
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryptify-unsigned-${{ steps.meta.outputs.short }}
          path: build/ios/tryptify.ipa
          retention-days: 14
          if-no-files-found: error
