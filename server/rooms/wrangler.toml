# Tryptify's rooms: Trypt Mania multiplayer and the listening parties.
# Deploy: npx wrangler deploy (from this folder). See README.md.
name = "tryptify-rooms"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "rooms.tryptify.com", custom_domain = true }]

[vars]
# The catalogue the website's Add songs searches (a TrypT HiFi server). Its
# password, if it has one, is the secret TRYPT_HIFI_KEY (wrangler secret put).
TRYPT_HIFI_URL = "https://trypt-hifi-production.up.railway.app"
# ffmpeg, for shared songs no browser plays (ffmpeg/, on Railway). Its key is
# the secret FFMPEG_KEY. Without both, the website gets the original.
# FFMPEG_URL = "https://<the Railway service>.up.railway.app"
# Sign-in: the phones say hello with their Supabase access token. The app's
# project and its public key (as in ../connect): they identify it, they grant
# nothing. Without them anyone gets in under the name they give.
SUPABASE_URL = "https://lvzorvfhhopillzlwgau.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2em9ydmZoaG9waWxsemx3Z2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNTc0NDQsImV4cCI6MjA4OTkzMzQ0NH0.Y_TN9r19WS96HyVZSQeNa0TyOqyBGuqFARaj8-7Ylow"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Every room, party and socket, in one object (src/hub.ts).
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ffmpeg"]

# ffmpeg left Cloudflare Containers for Railway (ffmpeg/, FFMPEG_URL below).
[[migrations]]
tag = "v3"
deleted_classes = ["Ffmpeg"]

# Shared songs, while their room or party wants them.
[[r2_buckets]]
binding = "SONGS"
bucket_name = "tryptify-rooms-songs"
