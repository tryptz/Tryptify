# Tryptify Cloud on Cloudflare Workers. Secrets are NOT here: set them with
#   wrangler secret put CREEM_API_KEY
#   wrangler secret put CREEM_WEBHOOK_SECRET
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_SECRET
name = "tryptify-cloud"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Its address on the product's own domain. The workers.dev address keeps
# working, for app builds made before it.
routes = [{ pattern = "cloud.tryptify.com", custom_domain = true }]

# Logs keep what the code writes (console.error), but not each request's
# address: a /play link and a Subsonic app's request carry a sign-in in it.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[[d1_databases]]
binding = "DB"
database_name = "tryptify-cloud"
database_id = "b2b03937-98bd-4fec-a132-ce0d0b932454"

# The listeners' music (phase 1). Downloads from R2 are free; storage is
# $0.015 per GB-month, the figure the plans were priced with.
[[r2_buckets]]
binding = "MUSIC"
bucket_name = "tryptify-cloud-music"

# Creem, live. Product ids are not secrets. For test mode, set
# CREEM_API_BASE = "https://test-api.creem.io" with the test products' ids
# and test-mode secrets.
[vars]
# Where Creem sends a buyer after paying: their account page, which shows the new plan.
CREEM_SUCCESS_URL = "https://tryptify.com/account?paid=1"
CREEM_PRODUCT_LITE_MONTHLY = "prod_63elKtKRItGQSMCIfqquAz"
CREEM_PRODUCT_LITE_YEARLY = "prod_1bjumyDR0OUeJWohM5rPWy"
CREEM_PRODUCT_PLUS_MONTHLY = "prod_28Df3920dPkS1izcsr6VGO"
CREEM_PRODUCT_PLUS_YEARLY = "prod_1HSF4zKQOe2zwqn6ulQXcF"
CREEM_PRODUCT_MAX_MONTHLY = "prod_4b9i4eCaYxDS9QwrZKhYV2"
CREEM_PRODUCT_MAX_YEARLY = "prod_6G4ubzzqvCaJKaamWsnHMt"
CREEM_PRODUCT_LITE_MONTHLY_TRIAL = "prod_56tTODaE022GeT50ruLqXj"
CREEM_PRODUCT_PLUS_MONTHLY_TRIAL = "prod_OSmi11W9RYftN5oUWt9rz"
CREEM_PRODUCT_MAX_MONTHLY_TRIAL = "prod_6dOHBryZ66HGZnk9wjwydV"

# PayPal: new checkouts go to it once PAYPAL_CLIENT_ID, PAYPAL_SECRET and
# PAYPAL_WEBHOOK_ID are all set; Creem above keeps renewing its subscribers.
# Plan ids are not secrets. tools/paypal_setup in the site's repository makes
# the plans and prints these lines; add them under [vars]:
#   PAYPAL_WEBHOOK_ID = "…"                  (the webhook to /webhooks/paypal)
#   PAYPAL_PLAN_LITE_MONTHLY = "P-…"   … PAYPAL_PLAN_VAULT_YEARLY, Lite's _TRIAL, and
#   PAYPAL_PLAN_<PLAN>_MONTHLY_INTRO for each other plan (first month half price)
#   (a plan with no ids is left out of /plans until they are added)
#   PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"   while testing only
# Live since 2026-10-24 (product PROD-1MK83635XY8578339). For sandbox testing,
# use the sandbox ids and secrets with PAYPAL_API_BASE as above.
PAYPAL_PLAN_LITE_MONTHLY = "P-7VH21141K1598551GNLOLHKQ"
PAYPAL_PLAN_LITE_MONTHLY_TRIAL = "P-6TG112940N206204SNLOLHKY"
PAYPAL_PLAN_LITE_YEARLY = "P-9YJ11454HJ503332BNLOLHKY"
PAYPAL_PLAN_PLUS_MONTHLY = "P-89B04685AU782703NNLOLHKY"
PAYPAL_PLAN_PLUS_MONTHLY_TRIAL = "P-5LK805840R021893CNLOLHLA"
PAYPAL_PLAN_PLUS_YEARLY = "P-53A24553SU088445BNLOLHLA"
PAYPAL_PLAN_MAX_MONTHLY = "P-7S346877EB4880024NLOLHLI"
PAYPAL_PLAN_MAX_MONTHLY_TRIAL = "P-25T79727D2066150CNLOLHLI"
PAYPAL_PLAN_MAX_YEARLY = "P-51K38798GV0904223NLOLHLQ"
PAYPAL_WEBHOOK_ID = "0C5710575V759231M"

# The daily cleanup: lapsed libraries and abandoned uploads (src/cleanup.ts).
[triggers]
crons = ["17 4 * * *"]
